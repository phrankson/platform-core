# =============================================================================
# .circleci/config.yml — platform-core CI/CD Pipeline
# =============================================================================
# Deployment pipeline for the platform-core repository.
#
# Strategy:
#   - On every commit to main -> preview + deploy to platform-sandbox -> validate
#   - On Git tag              -> re-validate sandbox, then (after approval) deploy to app-dev
#
# Prerequisites (not yet set up -- this file alone won't run without these):
#   - A CircleCI self-hosted runner registered under the resource class
#     `peh_runner/local_laptop_runner` (Organization Settings -> Self-Hosted
#     Runners). Without this, jobs will sit queued forever waiting for a
#     runner that doesn't exist.
#   - The `PLATFORM_ADMIN` context (already created for
#     platform-team-administration) holding PULUMI_ACCESS_TOKEN -- reused
#     here rather than creating a second context for the same credential.
#   - pulumi, docker, kind, kubectl, bats CLIs installed on that runner
#     (uv is bootstrapped by the setup-python command below).
#
# Deferred (commented out below, not yet built in this repo):
#   - OPA/conftest policy checks (no policy/ or environments/ directories yet)
#   - Flux GitOps reconciliation + smoke test (Flux hasn't been introduced yet)
# =============================================================================

version: 2.1

# ── Reusable anchors ─────────────────────────────────────────────────────────
# YAML anchors (&name) + aliases (*name) let us define something once and
# reuse it in multiple places below without copy-pasting it.
context: &context
  - PLATFORM_ADMIN

# Trigger filter: only pushes to the main branch, never tags.
on-push-main: &on-push-main
  branches:
    only: /^main$/
  tags:
    ignore: /.*/

# Trigger filter: only tags, never plain branch pushes.
on-tag-main: &on-tag-main
  branches:
    ignore: /.*/
  tags:
    only: /.*/

# ── Executors ─────────────────────────────────────────────────────────────────
# `machine: true` gives jobs a real VM instead of a Docker container --
# needed here because our jobs run `docker` and `kind` themselves.
executors:
  local-machine:
    machine: true
    resource_class: peh_runner/local_laptop_runner
    working_directory: ~/project

# ── Reusable commands ─────────────────────────────────────────────────────────
# A `command` is a named group of steps that jobs below can call by name,
# instead of repeating the same steps in every job.
commands:
  setup-python:
    description: Set up the Python virtual environment with uv
    steps:
      - run:
          name: Install dependencies
          command: |
            uv venv .venv
            source .venv/bin/activate
            uv pip install -r requirements.txt

  lint-code:
    description: Code linting (formatting, types, imports)
    steps:
      - run:
          name: Check code formatting with black
          command: |
            source .venv/bin/activate
            black --check --diff __main__.py modules/
      - run:
          name: Type check with mypy
          command: |
            source .venv/bin/activate
            mypy __main__.py modules/ --ignore-missing-imports
      - run:
          name: Check import sorting with isort
          command: |
            source .venv/bin/activate
            isort --check-only __main__.py modules/

  static-analysis:
    description: Static analysis and security scanning
    steps:
      - run:
          name: Lint with ruff
          command: |
            source .venv/bin/activate
            ruff check __main__.py modules/
      - run:
          name: Security scan with bandit
          command: |
            source .venv/bin/activate
            bandit -r __main__.py modules/ -ll

  # TODO: policy-check (OPA/conftest) -- reintroduce once policy/ and
  # environments/ exist in this repo.
  # policy-check:
  #   description: OPA/conftest policy validation
  #   steps:
  #     - run:
  #         name: Run conftest against environment manifests
  #         command: conftest test environments/ --policy policy/

# ── Jobs ──────────────────────────────────────────────────────────────────────
jobs:
  # Dry-run: lints the code, then shows what Pulumi *would* change, without
  # applying anything.
  pulumi-preview:
    executor: local-machine
    parameters:
      pulumi_stack:
        type: string
    steps:
      - checkout
      - setup-python
      - lint-code
      - static-analysis
      - run:
          name: Pulumi preview (<< parameters.pulumi_stack >>)
          command: |
            source .venv/bin/activate
            pulumi stack select << parameters.pulumi_stack >>
            pulumi preview

  # Applies the change for real. `--skip-preview` is safe here because the
  # pulumi-preview job above already ran and (via `requires:` in the
  # workflow) has to succeed first.
  pulumi-update:
    executor: local-machine
    parameters:
      pulumi_stack:
        type: string
    steps:
      - checkout
      - setup-python
      - run:
          name: Pulumi update (<< parameters.pulumi_stack >>)
          command: |
            source .venv/bin/activate
            pulumi stack select << parameters.pulumi_stack >>
            pulumi up --yes --skip-preview

  # Independent, after-the-fact check that the deployed infrastructure
  # actually works -- not just that `pulumi up` reported success.
  # tests/integration/infrastructure.bats fetches its own kubeconfig from
  # the selected stack's outputs, so this job only needs to select the
  # stack and hand it the right env vars.
  validate-infrastructure:
    executor: local-machine
    parameters:
      pulumi_stack:
        type: string
    steps:
      - checkout
      - run:
          name: Select stack
          command: |
            source .venv/bin/activate 2>/dev/null || true
            pulumi stack select << parameters.pulumi_stack >>
      - run:
          name: Run bats infrastructure tests
          command: |
            export PULUMI_STACK=<< parameters.pulumi_stack >>
            bats tests/integration/infrastructure.bats
      # TODO: Flux reconciliation + smoke test -- reintroduce once Flux is
      # actually deployed as part of this project.
      # - run:
      #     name: Force Flux reconciliation and smoke test
      #     command: |
      #       export PULUMI_STACK=<< parameters.pulumi_stack >>
      #       export SMOKE_HOST="${PULUMI_STACK}.local"
      #       bash scripts/flux_reconcile.sh
      - run:
          name: Clean up kubeconfig
          when: always
          command: rm -f kubeconfig.yaml

# ── Workflows ─────────────────────────────────────────────────────────────────
workflows:
  # Sandbox: runs on every commit to main. No approval gate -- sandbox is
  # meant to be disposable, so it deploys automatically for fast feedback.
  preview:
    jobs:
      - pulumi-preview:
          context: *context
          pulumi_stack: platform-sandbox
          filters: *on-push-main
      - pulumi-update:
          name: "Deploy to platform-sandbox"
          context: *context
          pulumi_stack: platform-sandbox
          requires:
            - pulumi-preview
          filters: *on-push-main
      - validate-infrastructure:
          name: "Validate platform-sandbox"
          context: *context
          pulumi_stack: platform-sandbox
          requires:
            - Deploy to platform-sandbox
          filters: *on-push-main

  # Promotion: runs on a Git tag. Re-validates sandbox against the tagged
  # commit first, then -- only after a human approves -- promotes the same
  # change to app-dev.
  update:
    jobs:
      - pulumi-preview:
          context: *context
          pulumi_stack: platform-sandbox
          filters: *on-tag-main
      - pulumi-update:
          name: "Deploy to platform-sandbox (tag)"
          context: *context
          pulumi_stack: platform-sandbox
          requires:
            - pulumi-preview
          filters: *on-tag-main
      - validate-infrastructure:
          name: "Validate platform-sandbox (tag)"
          context: *context
          pulumi_stack: platform-sandbox
          requires:
            - Deploy to platform-sandbox (tag)
          filters: *on-tag-main

      # Manual approval gate: `type: approval` jobs are a CircleCI built-in
      # invoked directly in a workflow -- they must NOT also be declared
      # under top-level `jobs:` (that job's own `steps:` would never run;
      # this is the same bug we found and fixed in
      # platform-team-administration's config.yml).
      - approve-app-dev-deploy:
          type: approval
          requires:
            - Validate platform-sandbox (tag)
          filters: *on-tag-main

      - pulumi-update:
          name: "Deploy to app-dev"
          context: *context
          pulumi_stack: app-dev
          requires:
            - approve-app-dev-deploy
          filters: *on-tag-main
      - validate-infrastructure:
          name: "Validate app-dev"
          context: *context
          pulumi_stack: app-dev
          requires:
            - Deploy to app-dev
          filters: *on-tag-main
